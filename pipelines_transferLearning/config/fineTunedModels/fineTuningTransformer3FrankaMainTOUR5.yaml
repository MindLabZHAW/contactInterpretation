project:
  data_name: "ur5"
  dof: 6
  dataset_dir: "dataset/{data_name}/labeled_data"
  models_dir: "pipelines_transferLearning/trained_models/ur5/"
  save_model_dir: "pipelines_transferLearning/trained_models/{data_name}/"


detection_model:
  architecture: 'TransformerModel'
  type: 'm2_transformer_contactDetection'
  version: '64'
  model_init_args:
    task: 'detection'
    d_model: 128
    nhead: 2
    num_encoder_layers: 8
    num_features: &det_seq 100
    dropout: 0.3
    # dim_feedforward: 512 #default = 4*d_model

  filename_params:
    accuracy: 93.56 #91.96
    acc: 88.77  #0.0001
  weights_file_template: 'dModel{d_model}_nHead{nhead}_nLayer{num_encoder_layers}_sNum{num_features}s_acc{accuracy:.2f}_acc{acc:.2f}.pth'

  trainer_params:
    window_length: *det_seq
    training_gap: 1
    validation_gap: 5
    epochs: 100
    batch_size: 64
    learning_rate: 0.0001
    optimizer: 'AdamW'
    early_stop_patience: 3

  evaluator_params:
    window_length: *det_seq
    gap: 1
    batch_size: 1024
    n_majority_voting: 14
    allowable_delay_ms: 150

localization_model:
  architecture: 'TransformerModel'
  type: 'm2_transformer_contactLocalization'
  version: '64'
  model_init_args:
    task: 'localization'
    d_model: 512
    nhead: 8
    num_encoder_layers: 8
    num_features: &loc_seq 300
    dropout: 0.3
    # dim_feedforward: 512 #default = 4*d_model

  filename_params:
    accuracy: 92.60 #86.49
    acc: 86.43

  weights_file_template: 'dModel{d_model}_nHead{nhead}_nLayer{num_encoder_layers}_sNum{num_features}_acc{accuracy:.2f}_acc{acc:.2f}.pth'

  trainer_params:
    window_length: *loc_seq
    training_gap: 1
    validation_gap: 5
    epochs: 100
    batch_size: 64
    learning_rate: 0.0002
    optimizer: 'AdamW'
    early_stop_patience: 3

  evaluator_params:
    window_length: *loc_seq
    gap: 1
    batch_size: 1024
    n_majority_voting: 14
    allowable_delay_ms: 150


labels:
  link7: 7
  link6: 6
  link5: 5
  link4: 4
  link3: 3
  link2: 2
  link1: 1
  no_contact: 0