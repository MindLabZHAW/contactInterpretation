project:
    # The name of the dataset (e.g., "franka_main", "ur5").
    data_name: "franka_main"
    # Degrees of Freedom of the robot.
    dof: 7
    dataset_dir: "dataset/{data_name}/labeled_data"
    models_dir: "pipelines/trained_models/franka_main"
    save_model_dir: "pipelines_transferLearning/trained_models/{data_name}/"


detection_model:
  architecture: 'TransformerModel'
  type: 'm2_transformer_contactDetection'
  version: '64'
  model_init_args:
    task: 'detection'
    d_model: 128
    nhead: 8
    num_encoder_layers: 1
    num_features: &det_seq 200
    dropout: 0.3
    # dim_feedforward: 2048 #default = d_model*4

  filename_params:
    accuracy: 'idk'
  weights_file_template: 'dModel{d_model}_nHead{nhead}_nLayer{num_encoder_layers}_sNum{num_features}s_acc{accuracy:.2f}.pth'
  
  # --- Data Parameters for the TRAINER ---
  trainer_params:
    window_length: *det_seq
    training_gap: 1
    # A larger gap for the validation set (during training) to speed up epochs.
    validation_gap: 5
    epochs: 40
    batch_size: 64
    learning_rate: 0.0001
    optimizer: 'AdamW'
    early_stop_patience: 3

  # --- Data Parameters for the FINAL EVALUATOR ---
  evaluator_params:
    window_length: *det_seq
    gap: 1
    batch_size: 1024
    n_majority_voting: 14
    allowable_delay_ms: 150
  
localization_model:
    architecture: 'cnnBiLSTM'
    type: 'm2_cnnBiLSTM_contactLocalization'
    version: '64'

    model_init_args:
      task: 'localization'
      num_layers: 1    
      hidden_size: 128 
      num_features: &loc_seq 250

    filename_params:
      gap: 1
      accuracy: 'idk'

    weights_file_template: 'numLayer{num_layers}_hiddenSize{hidden_size}_seq_num{num_features}_gap{gap}_accuracy{accuracy:.2f}.pth'

    # --- Data Parameters for the TRAINER ---
    trainer_params:
      window_length: *loc_seq
      training_gap: 1
      validation_gap: 5
      epochs: 40
      batch_size: 65
      learning_rate: 0.001
      optimizer: 'Adam'
      early_stop_patience: 3

    # --- Data Parameters for the FINAL EVALUATOR ---
    evaluator_params:
      window_length: *loc_seq
      gap: 1
      batch_size: 1024
      n_majority_voting: 14
      allowable_delay_ms: 150


# --- Label Mapping ---
# Maps keywords in filenames to ground truth labels.
labels:
    link7: 7
    link6: 6
    link5: 5
    link4: 4
    link3: 3
    link2: 2
    link1: 1
    no_contact: 0