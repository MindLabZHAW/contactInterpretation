project:
  data_name: "franka_mindlab"
  dof: 7
  dataset_dir: "dataset/{data_name}/labeled_data"
  models_dir: "pipelines_transferLearning/trained_models/{data_name}"
  save_model_dir: "pipelines_transferLearning/trained_models/{data_name}/"


detection_model:
  architecture: 'TransformerModel'
  type: 'm2_transformer_contactDetection'
  version: '64'
  model_init_args:
    task: 'detection'
    d_model: 128
    nhead: 8
    num_encoder_layers: 1
    num_features: &det_seq 100
    dropout: 0.3
    # dim_feedforward: 512 #default = 4*d_model
  
  filename_params:
    accuracy: 83.99 #89.32
    gap: 20
  weights_file_template: 'dModel{d_model}_nHead{nhead}_nLayer{num_encoder_layers}_sNum{num_features}s_acc{accuracy:.2f}.pth'

  trainer_params:
    window_length: *det_seq
    training_gap: 20
    validation_gap: 5
    epochs: 60
    batch_size: 65
    learning_rate: 0.0002
    optimizer: 'AdamW'
    early_stop_patience: 8

  evaluator_params:
    window_length: *det_seq
    gap: 1
    batch_size: 1024
    n_majority_voting: 14
    allowable_delay_ms: 150

localization_model:
    architecture: 'cnnBiLSTM'
    type: 'm2_cnnBiLSTM_contactLocalization'
    version: '64'
    
    model_init_args:
      num_features: &loc_seq 350
      hidden_size: 128
      num_layers: 1
      task: 'localization'
      
    filename_params:
      gap: 20
      accuracy: 89.22 #90.60 

    weights_file_template: 'numLayer{num_layers}_hiddenSize{hidden_size}_seq_num{num_features}_gap{gap}_accuracy{accuracy:.2f}.pth'

    trainer_params:
      window_length: *loc_seq
      training_gap: 20
      validation_gap: 5
      epochs: 40
      batch_size: 65
      learning_rate: 0.0001
      optimizer: 'AdamW'
      early_stop_patience: 8
      
    evaluator_params:
      window_length: *loc_seq
      gap: 1
      batch_size: 2048
      n_majority_voting: 14
      allowable_delay_ms: 150

labels:
  link7: 7
  link6: 6
  link5: 5
  link4: 4
  link3: 3
  link2: 2
  link1: 1
  no_contact: 0