# General evaluation settings
data_name: "ur5"
dof: 6

# Parameters for the evaluation process
evaluation_params:
  batch_size: 1024
  n_majority_voting: 14
  allowable_delay_ms: 150

# Templates for constructing file paths
paths:
  # Base directory for the dataset
  dataset_dir: 'dataset/{data_name}/labeled_data'
  # Base directory where trained models are stored
  models_dir: 'pipelines/trained_models/franka_main/'

# --- Model Specific Configurations ---
detection_model:
  architecture: 'cnnLSTM_contactDetection'
  type: 'm2_cnnBiLSTM_contactDetection'
  version: '64'

  # Arguments for the model's __init__(...) function, defined with ANCHORS (&)
  model_init_args:
    num_features_joints: &det_seq 80
    hidden_size:  256
    num_layers:  3

  # Parameters used only for building the weights filename
  filename_params:
    gap: 1
    accuracy: 93.55 #95.95

  # A template string with placeholders for Python to format
  weights_file_template: 'numLayer{num_layers}_hiddenSize{hidden_size}_seq_num{num_features_joints}_gap{gap}_accuracy{accuracy:.2f}.pth'

  # Parameters needed for the LoadSeqDataset, reusing values with ALIASES (*)
  data_loader_params:
    seq_num: *det_seq
    gap: 1

localization_model:
  architecture: 'cnnLSTM_contactLocalization'
  type: 'm2_cnnBiLSTM_contactLocalization'
  version: '64'
  
  model_init_args:
    num_features_joints: &loc_seq 150
    hidden_size: 256
    num_layers:  2

  filename_params:
    gap: 1
    accuracy: 94.49 # 98.75

  weights_file_template: 'numLayer{num_layers}_hiddenSize{hidden_size}_seq_num{num_features_joints}_gap{gap}_accuracy{accuracy:.2f}.pth'

  data_loader_params:
    seq_num: *loc_seq
    gap: 1

# Label mapping for this dataset
labels:
  link7: 7
  link6: 6
  link5: 5
  link4: 4
  link3: 3
  link2: 2
  link1: 1
  no_contact: 0